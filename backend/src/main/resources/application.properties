spring.application.name=smartcampus

spring.datasource.url=jdbc:mysql://localhost:3306/smartcampus
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# JWT Configuration
app.jwtSecret=MyVeryLongSecureSecretKeyForJWTTokenSigningPurposeWithMinimumLengthForHS512
app.jwtExpirationMs=86400000
app.jwtRefreshExpirationMs=604800000

# CORS Configuration
app.cors.allowedOrigins=http://localhost:5173,http://localhost:3000,http://localhost:8080

# OAuth Configuration
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v1/userinfo